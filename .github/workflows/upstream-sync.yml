name: Check OpenAI Codex upstream

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out downstream main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream
        id: upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/openai/codex.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Prepare upstream sync pull request
        if: steps.upstream.outputs.needed == 'true'
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/sync-upstream

          if git merge --no-ff --no-commit upstream/main; then
            git commit -m "chore: stage upstream Codex update"
            git push --force-with-lease origin HEAD:automation/sync-upstream
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflict_files=$(git diff --name-only --diff-filter=U | paste -sd ', ' -)
          git merge --abort
          echo "conflicted=true" >> "$GITHUB_OUTPUT"
          echo "files=$conflict_files" >> "$GITHUB_OUTPUT"

      - name: Open or refresh sync pull request
        if: steps.upstream.outputs.needed == 'true' && steps.merge.outputs.conflicted == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/sync-upstream --base main --state open --json number --jq '.[0].number')

          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/sync-upstream \
              --title "chore: stage upstream Codex update" \
              --body "Stages OpenAI Codex upstream commit \`$UPSTREAM_SHA\` for review. This PR is intentionally not auto-merged."
          fi

      - name: Report a blocked sync
        if: steps.upstream.outputs.needed == 'true' && steps.merge.outputs.conflicted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT_FILES: ${{ steps.merge.outputs.files }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          title="Upstream sync blocked"
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')

          if [ -z "$issue_number" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "Upstream commit \`$UPSTREAM_SHA\` conflicts with downstream changes in: $CONFLICT_FILES. Resolve this in a dedicated sync branch; do not bypass the conflict with a force push to \`main\`."
          fi

          exit 1
